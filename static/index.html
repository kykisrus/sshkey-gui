<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSH-ключи — передача на сервер</title>
<style>
  :root{
    --bg:#12171d; --panel:#161b22; --panel2:#1c2331; --line:#2a3341;
    --ink:#e6edf3; --ink2:#9aa7b6; --accent:#3b82f6; --good:#22c55e; --bad:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
  }
  header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .path{color:var(--ink2);font-size:12px;font-family:ui-monospace,monospace}
  header .spacer{flex:1}
  header .ver{color:var(--ink2);font-size:12px;font-family:ui-monospace,monospace;border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}

  main{
    flex:1 1 auto;min-height:0;display:grid;gap:16px;padding:16px;width:100%;
    grid-template-columns:minmax(320px,420px) 1fr;
  }
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:14px;display:flex;flex-direction:column;min-height:0;
  }
  .panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);margin:0 0 10px;flex:0 0 auto}

  /* прокрутка только внутри списка ключей */
  #keys{overflow-y:auto;flex:1 1 auto;min-height:0;padding-right:4px;scrollbar-gutter:stable}
  #keys::-webkit-scrollbar{width:10px}
  #keys::-webkit-scrollbar-thumb{background:#33405a;border-radius:8px}
  #keys::-webkit-scrollbar-track{background:transparent}

  .key{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--panel2);transition:.15s}
  .key:hover{border-color:#3c4a5e}
  .key.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .key.disabled{opacity:.5;cursor:not-allowed}
  .key .dot{width:10px;height:10px;border-radius:50%;background:var(--good);margin-top:5px;flex:0 0 auto}
  .key.disabled .dot{background:var(--bad)}
  .key .name{font-weight:600;font-family:ui-monospace,monospace}
  .key .meta{color:var(--ink2);font-size:12px;word-break:break-all}

  label{display:block;font-size:12px;color:var(--ink2);margin:0 0 4px}
  input{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:#0c1015;color:var(--ink);font:inherit}
  input:focus{outline:none;border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 110px;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .field{margin-bottom:10px}
  .note{color:var(--ink2);font-size:12px;margin:-4px 0 10px}
  .actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;flex:0 0 auto}
  button{padding:10px 16px;border-radius:9px;border:1px solid transparent;font:inherit;font-weight:600;cursor:pointer}
  button.primary{background:var(--accent);color:#fff}
  button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  button:disabled{opacity:.55;cursor:progress}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;flex:0 0 auto}
  .badge{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}
  .badge.ok{color:#bbf7d0;border-color:#14532d;background:#052e16}
  .badge.bad{color:#fecaca;border-color:#7f1d1d;background:#2a0b0b}
  .badge.warn{color:#fde68a;border-color:#78350f;background:#2a1a05}

  pre{
    margin:12px 0 0;padding:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    color:#cfd9e3;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;
    flex:1 1 auto;min-height:80px;overflow:auto;
  }
  .hint{color:var(--ink2);font-size:12px;margin-top:8px;flex:0 0 auto}

  @media (max-width:900px){
    body{overflow:auto}
    main{grid-template-columns:1fr;min-height:0}
    #keys{max-height:40vh}
  }
</style>
</head>
<body>
<header>
  <h1>Передача SSH-ключа</h1>
  <span class="path" id="keysPath"></span>
  <span class="spacer"></span>
  <span class="ver" id="version"></span>
</header>

<main>
  <section class="panel">
    <h2>Ключи</h2>
    <div id="keys"><div class="hint">Загружаю…</div></div>
    <div class="hint">Показаны файлы <code>*.pub</code> из ~/.ssh. Без приватной пары ключ выбрать нельзя.</div>
  </section>

  <section class="panel">
    <h2>Сервер</h2>
    <div class="row">
      <div class="field">
        <label for="host">IP или хост сервера</label>
        <input id="host" placeholder="127.0.0.1" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="port">Порт</label>
        <input id="port" value="22" inputmode="numeric">
      </div>
    </div>
    <div class="note">Ключ передаётся на этот адрес. <code>127.0.0.1</code> — только пример: это адрес самого интерфейса, а не сервера.</div>
    <div class="row3">
      <div class="field">
        <label for="user">Пользователь на сервере</label>
        <input id="user" placeholder="user" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Пароль (для передачи, необязательно)</label>
        <input id="password" type="password" placeholder="если вход по паролю" autocomplete="new-password">
      </div>
    </div>

    <div class="actions">
      <button class="ghost" id="checkBtn">Проверить связь</button>
      <button class="primary" id="copyBtn">Передать ключ</button>
    </div>

    <div class="badges" id="badges"></div>
    <pre id="log">Готово к работе. Выбери ключ слева, укажи IP и нажми «Проверить связь».</pre>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let KEYS = [];
let SELECTED = null;

function log(text){ $('log').textContent = text; }
function badge(text, cls){ const b=document.createElement('span'); b.className='badge '+(cls||''); b.textContent=text; $('badges').appendChild(b); }
function clearBadges(){ $('badges').innerHTML=''; }

async function loadKeys(){
  const r = await fetch('/api/keys');
  const data = await r.json();
  KEYS = data.keys || [];
  $('keysPath').textContent = data.home || '';
  $('version').textContent = data.version ? 'v' + data.version : '';

  const box = $('keys');
  box.innerHTML = '';
  if (!KEYS.length){ box.innerHTML = '<div class="hint">В ~/.ssh нет ключей *.pub</div>'; return; }

  KEYS.forEach((k) => {
    const el = document.createElement('div');
    el.className = 'key' + (k.usable ? '' : ' disabled');
    el.innerHTML = `<span class="dot"></span><div>
        <div class="name">${k.name}</div>
        <div class="meta">${k.type || '?'} ${k.bits || ''} · ${k.fingerprint || 'нет отпечатка'}</div>
        <div class="meta">${k.comment || 'без комментария'}</div>
      </div>`;
    if (k.usable){
      el.onclick = () => {
        document.querySelectorAll('.key').forEach(x => x.classList.remove('sel'));
        el.classList.add('sel'); SELECTED = k;
      };
      if (!SELECTED){ el.classList.add('sel'); SELECTED = k; }
    }
    box.appendChild(el);
  });
}

function payload(){
  return { host: $('host').value.trim(), port: parseInt($('port').value || '22', 10),
           user: $('user').value.trim(), key: SELECTED ? SELECTED.private : '',
           password: $('password').value };
}

async function post(url, body){
  const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  return r.json();
}

$('checkBtn').onclick = async () => {
  clearBadges();
  const p = payload();
  if (!p.host){ log('Укажи IP или хост сервера.'); return; }
  $('checkBtn').disabled = true; log('Проверяю TCP и SSH…');
  try{
    const d = await post('/api/check', p);
    if (d.error){ log('Ошибка: ' + d.error); return; }
    if (d.tcp.ok){
      badge(`TCP ок · ${d.tcp.ms} мс`, 'ok');
      if (d.tcp.banner) badge(d.tcp.banner.split(' ')[0], '');
    } else {
      badge('TCP недоступен', 'bad');
    }
    let text = `Сервер: ${d.user || '—'}@${d.host}:${d.port}\n`;
    if (d.tcp.ok && d.key_auth){
      if (d.key_auth.ok) { badge('вход по ключу работает', 'ok'); text += `Ключ уже пускает: ${d.key_auth.ms} мс\n`; }
      else { badge('ключ ещё не работает', 'warn'); text += `Проверка ключа: ${d.key_auth.detail || 'отказ'}\n`; }
    }
    text += d.tcp.ok ? `SSH-баннер: ${d.tcp.banner || 'нет'}\n` : `Ошибка TCP: ${d.tcp.error}\n`;
    log(text);
  } catch(e){ log('Сбой запроса: ' + e); }
  finally { $('checkBtn').disabled = false; }
};

$('copyBtn').onclick = async () => {
  clearBadges();
  const p = payload();
  if (!p.host || !p.key){ log('Нужен выбранный ключ и IP сервера.'); return; }
  $('copyBtn').disabled = true; log('Передаю ключ…');
  try{
    const d = await post('/api/copy', p);
    if (d.error){ log('Ошибка: ' + d.error); return; }
    badge(d.ok ? 'ключ работает' : 'не удалось', d.ok ? 'ok' : 'bad');
    let text = (d.message || '') + `\nСервер: ${p.user || '—'}@${p.host}:${p.port}\n`;
    if (d.copy) text += `\nУстановка: код ${d.copy.code}, ${d.copy.ms} мс\n${d.copy.stdout || ''}\n${d.copy.stderr || ''}`;
    if (d.verify) text += `\nПроверка входа по ключу: ${d.verify.ok ? 'успешно' : 'нет'} (${d.verify.ms} мс)\n${d.verify.detail || ''}`;
    log(text.trim());
    $('password').value = '';
  } catch(e){ log('Сбой запроса: ' + e); }
  finally { $('copyBtn').disabled = false; }
};

loadKeys();
</script>
</body>
</html>
